name: Configure Cloudflare Email Sending

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Configure authenticated contact-form email
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Onboard and verify sending domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
        run: node workers/contact-form/scripts/configure-email-sending.mjs
